[package]
name = "cellguard-cli"
version = "0.1.0"
description = "Host-side tool for the CellGuard field bus: push signed firmware images, probe device state."
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "cellguard-cli"
test = false
bench = false

[lints]
workspace = true

[dependencies]
cellboot = { path = "../libraries/cellboot" }
cellcore = { path = "../libraries/cellcore", features = ["sign"] }
cellguard-panic = { path = "../libraries/cellguard-panic" }
cellguard-protocol = { path = "../libraries/cellguard-protocol", features = ["bootloader", "telemetry"] }
hmac-sha256 = "1"
serialport = { version = "4", default-features = false }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

# See: <https://rust-lang.github.io/rust-clippy/master/index.html>
[workspace.lints.clippy]
# Groups
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Individual lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
float_arithmetic = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"
# Transitive deps of clap/serialport pull duplicate versions of bitflags and
# windows-sys. Not actionable from this crate.
multiple_crate_versions = "allow"
