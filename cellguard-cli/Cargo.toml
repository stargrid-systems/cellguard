[package]
name = "cellguard-cli"
version = "0.1.0"
description = "Host-side tool for the CellGuard field bus: push signed firmware images, probe device state."
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "cellguard-cli"
test = false
bench = false

[dependencies]
cellboot = { path = "../libraries/cellboot" }
cellcore = { path = "../libraries/cellcore" }
cellguard-panic = { path = "../libraries/cellguard-panic" }
cellguard-protocol = { path = "../libraries/cellguard-protocol", features = ["bootloader"] }
hmac-sha256 = "1"
serialport = { version = "4", default-features = false }
clap = { version = "4", features = ["derive"] }

[lints.rustdoc]
missing_crate_level_docs = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Transitive deps of clap/serialport pull duplicate versions of bitflags and
# windows-sys. Not actionable from this crate.
multiple_crate_versions = "allow"
unwrap_used = "warn"
expect_used = "warn"
