name: CI

on:
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover crates
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.list.outputs.crates }}
      workspaces: ${{ steps.list.outputs.workspaces }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List standalone crates
        id: list
        run: |
          mapfile -t dirs < <(
            find . -maxdepth 2 -name Cargo.toml -not -path './libraries/*' -printf '%h\n' |
              cut -d/ -f2 | sort
          )
          {
            echo "crates=$(printf '%s\n' "${dirs[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
            echo "workspaces<<EOF"
            echo "libraries"
            printf '%s\n' "${dirs[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: discover
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          toolchain=$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)
          rustup toolchain install --profile minimal "$toolchain"
          rustup component add --toolchain "$toolchain" rustfmt clippy rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ needs.discover.outputs.workspaces }}
      - name: rustfmt
        run: |
          (cd libraries && cargo fmt --all --check)
          for crate in ${{ join(fromJSON(needs.discover.outputs.crates), ' ') }}; do
            (cd "$crate" && cargo fmt --check)
          done
      - name: clippy
        run: |
          (cd libraries && cargo clippy --workspace --all-targets --all-features --locked -- -D warnings)
          for crate in ${{ join(fromJSON(needs.discover.outputs.crates), ' ') }}; do
            (cd "$crate" && cargo clippy --all-targets --locked -- -D warnings)
          done
      - name: rustdoc
        run: |
          (cd libraries && cargo doc --workspace --no-deps --locked)
          for crate in ${{ join(fromJSON(needs.discover.outputs.crates), ' ') }}; do
            (cd "$crate" && cargo doc --no-deps --locked)
          done

  test:
    name: Test
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          toolchain=$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)
          rustup toolchain install --profile minimal "$toolchain"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: libraries
      - name: Test
        run: cargo test --workspace --all-features --locked
        working-directory: libraries

  build:
    name: Build ${{ matrix.crate }}
    if: github.event_name == 'merge_group'
    needs: discover
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.discover.outputs.crates) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install AVR toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-avr
      - name: Install Rust toolchain
        run: |
          toolchain=$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)
          rustup toolchain install --profile minimal "$toolchain"
          rustup component add --toolchain "$toolchain" rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Build
        run: cargo build --release --locked
        working-directory: ${{ matrix.crate }}

  ci-pass:
    name: ci-pass
    needs: [lint, test, build]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in "$LINT_RESULT" "$TEST_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "upstream job result: $result"
              exit 1
            fi
          done
