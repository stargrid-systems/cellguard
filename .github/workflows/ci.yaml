name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover workspaces
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.discover.outputs.workspaces }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discover
        uses: ./.github/actions/discover-workspaces

  lint:
    name: Lint (${{ matrix.workspace }})
    needs: discover
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-toolchain
        with:
          components: rustfmt clippy rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: rustfmt
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --all --check
      - name: clippy
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: rustdoc
        working-directory: ${{ matrix.workspace }}
        run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (${{ matrix.workspace }})
    if: github.event_name == 'merge_group'
    needs: discover
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: target
        name: Detect AVR workspace
        working-directory: ${{ matrix.workspace }}
        run: |
          if grep -q 'target = "avr-none"' .cargo/config.toml 2>/dev/null; then
            echo "avr=true" >>"$GITHUB_OUTPUT"
          else
            echo "avr=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/install-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Test
        if: steps.target.outputs.avr == 'false'
        working-directory: ${{ matrix.workspace }}
        run: cargo test --workspace --all-features --locked

  build:
    name: Build (${{ matrix.workspace }})
    if: github.event_name == 'merge_group'
    needs: discover
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: target
        name: Detect AVR workspace
        working-directory: ${{ matrix.workspace }}
        run: |
          if grep -q 'target = "avr-none"' .cargo/config.toml 2>/dev/null; then
            echo "avr=true" >>"$GITHUB_OUTPUT"
          else
            echo "avr=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/install-toolchain
        with:
          components: rust-src
          avr-linker: ${{ steps.target.outputs.avr }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Build
        working-directory: ${{ matrix.workspace }}
        run: cargo build --release --locked
      # Library-only AVR workspaces such as avrxt-hal link no ELF, so there
      # is nothing to measure.
      - name: Flash size gate
        if: steps.target.outputs.avr == 'true'
        working-directory: ${{ matrix.workspace }}
        run: |
          shopt -s nullglob
          elfs=(target/avr-none/release/*.elf)
          if (( ${#elfs[@]} > 0 )); then
            "$GITHUB_WORKSPACE/.github/scripts/flash-size-gate.sh" "$PWD"
          fi

  ci-pass:
    name: ci-pass
    needs: [lint, test, build]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in "$LINT_RESULT" "$TEST_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "upstream job result: $result"
              exit 1
            fi
          done
