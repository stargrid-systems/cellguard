[package]
name = "cellprog-attiny406"
version = "0.1.0"
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"

[[bin]]
name = "cellprog-attiny406"
test = false
bench = false

[dependencies]
avr-device = { version = "0.8", features = ["attiny406", "rt"] }
avrxt-hal = { path = "../libraries/avrxt-hal", features = ["attiny406"] }
cellboot = { path = "../libraries/cellboot", features = ["drivers"] }
cellguard-protocol = { path = "../libraries/cellguard-protocol", features = ["bootloader"] }
cellprog = { path = "../libraries/cellprog" }
cat25 = { path = "../libraries/cat25" }
embedded-hal = { version = "1", default-features = false }
embedded-hal-bus = { version = "0.3", default-features = false }
embedded-io = { version = "0.7", default-features = false }
panic-log = { path = "../libraries/panic-log", features = ["hal"] }
updi = { path = "../libraries/updi" }

[patch.crates-io]
avr-device = { git = "https://github.com/stargrid-systems/avr-device", rev = "73ba68ab5bd7bb03874bc456b329f4c141f1a08e" }

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
