cargo-features = ["panic-immediate-abort"]

[package]
name = "cellprog-attiny406"
version = "0.1.0"
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "cellprog-attiny406"
test = false
bench = false

[lints]
workspace = true

[dependencies]
avr-device = { version = "0.9", features = ["attiny406", "rt"] }
avrxt-hal = { path = "../libraries/avrxt-hal", features = ["attiny406"] }
cellguard-protocol = { path = "../libraries/cellguard-protocol", features = ["bootloader"] }
cellprog = { path = "../libraries/cellprog" }
embedded-hal = { version = "1", default-features = false }
updi = { path = "../libraries/updi" }

[patch.crates-io]
avr-device = { git = "https://github.com/stargrid-systems/avr-device", rev = "18b19ea9365b1d6a9ccb437a717bff0cceddb571" }

[profile.dev]
panic = "immediate-abort"
lto = true
opt-level = "s"

[profile.release]
panic = "immediate-abort"
codegen-units = 1
debug = true
lto = true
opt-level = "z"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

# See: <https://rust-lang.github.io/rust-clippy/master/index.html>
[workspace.lints.clippy]
# Groups
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Individual lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
float_arithmetic = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"
# Transitive deps of avr-device pull duplicate versions of syn and friends.
# Not actionable from this crate.
multiple_crate_versions = "allow"
