[package]
name = "avrxt-hal"
version = "0.1.0"
description = "Hardware abstraction layer for Microchip modern-AVR (AVRxt) devices: AVR128 DB/DA and tinyAVR."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Implement `ufmt::uWrite` for the USART so it can be used with `uwrite!`.
ufmt = ["dep:ufmt"]

# Internal family markers. Do not enable directly.
_avr128 = []
_tinyavr = []

avr128db48 = ["avr-device/avr128db48", "_avr128"]
avr128db64 = ["avr-device/avr128db64", "_avr128"]
avr128da64 = ["avr-device/avr128da64", "_avr128"]

attiny406 = ["avr-device/attiny406", "_tinyavr"]
attiny416 = ["avr-device/attiny416", "_tinyavr"]

[dependencies]
avr-device.workspace = true
embedded-hal.workspace = true
embedded-io.workspace = true
ufmt = { workspace = true, optional = true }

[lints]
workspace = true
