[package]
name = "cellboot"
version = "0.1.0"
description = "Hardware-independent core of the CellGuard bootloader and firmware-update system."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
drivers = ["dep:cat25", "dep:embedded-hal"]
avr128 = ["dep:avrxt-hal", "avrxt-hal/avr128db64"]
testutil = []

[dependencies]
avrxt-hal = { workspace = true, optional = true }
cat25 = { workspace = true, optional = true }
crc = { workspace = true }
embedded-hal = { workspace = true, optional = true }

[dev-dependencies]
embedded-hal-mock = { workspace = true, features = ["eh1"] }

[lints]
workspace = true
