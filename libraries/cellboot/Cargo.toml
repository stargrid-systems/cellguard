[package]
name = "cellboot"
version = "0.1.0"
description = "Hardware-independent core of the CellGuard bootloader and firmware-update system."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
crc = { workspace = true, optional = true }
hmac-sha256 = { workspace = true, optional = true }
cellguard-protocol = { workspace = true, optional = true, features = ["bootloader"] }
cat25 = { workspace = true, optional = true }
embedded-hal = { workspace = true, optional = true }
avrxt-hal = { workspace = true, optional = true }

[dev-dependencies]
embedded-hal-mock = { workspace = true, features = ["eh1"] }

[features]
# Update-agent side (AVR128). Pulls in the crypto and protocol deps.
agent = ["dep:crc", "dep:hmac-sha256", "dep:cellguard-protocol"]
# Shared Cat25Store image-store adapter.
drivers = ["dep:cat25", "dep:embedded-hal"]
# AVR128 on-chip NVM adapters. Pulls in avrxt-hal, so avr-none only.
avr128 = ["dep:avrxt-hal"]

[lints]
workspace = true
