[workspace]
resolver = "3"
members = ["ads131m08", "cat25", "cellboot", "crc", "p3t1755", "sha256", "tca9535"]

[workspace.package]
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/stargrid-systems/cellguard"
rust-version = "1.93"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

# See: <https://rust-lang.github.io/rust-clippy/master/index.html>
[workspace.lints.clippy]
# Groups
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Individual lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
float_arithmetic = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"

[workspace.dependencies]
embedded-hal = { version = "1", default-features = false }
embedded-hal-mock = { version = "0.11", default-features = false }
zerocopy = { version = "0.8", default-features = false }
crc = { path = "crc" }
sha256 = { path = "sha256" }
cellguard-protocol = { path = "cellguard-protocol" }
