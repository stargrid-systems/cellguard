[package]
name = "cellboot-drivers"
version = "0.1.0"
description = "Adapters implementing cellboot's I/O traits over device drivers."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cellboot.workspace = true
cat25.workspace = true
embedded-hal.workspace = true
avrxt-hal = { path = "../../avrxt-hal", optional = true }

[dev-dependencies]
embedded-hal-mock = { workspace = true, features = ["eh1"] }

[features]
# On-chip NVM adapters for AVR128 (EEPROM state store, USERROW key store).
# Pulls in `avrxt-hal`, so it only builds for the `avr-none` target. The
# firmware selects the concrete device via an `avrxt-hal` device feature.
avr128 = ["dep:avrxt-hal"]

[lints]
workspace = true
