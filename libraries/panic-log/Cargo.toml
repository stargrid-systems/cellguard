[package]
name = "panic-log"
version = "0.1.0"
description = "Persistent panic record and crash-loop policy for the CellGuard firmware."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# NVM-backed panic-record storage and reset/halt policy. Pulls in `avrxt-hal`,
# so this feature only builds for the `avr-none` target. The [`record`]
# `PanicRecord` type is always available without it.
hal = ["dep:avrxt-hal"]

[dependencies]
crc.workspace = true
avrxt-hal = { workspace = true, optional = true }

[lints]
workspace = true
