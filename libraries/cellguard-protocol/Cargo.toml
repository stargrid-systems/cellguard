[package]
name = "cellguard-protocol"
version = "0.1.0"
description = "Universal COBS-framed packet protocol for the CellGuard RS485 bus."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Adds the bootloader message kinds to the central registry. Additive.
bootloader = []
# Adds the flash read-back path to the session protocol (`PageRead` and
# `PageData`). Measured 722 B on the ATtiny406 servant, so the smallest
# builds leave it out and the master trusts write status instead of
# verifying by read-back. Additive.
page-read = []

[dependencies]
crc = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }

[lints]
workspace = true
