[package]
name = "cellcore"
version = "0.1.0"
description = "Hardware-independent update-agent logic for the CellGuard core MCU."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cellboot = { workspace = true }
cellguard-protocol = { workspace = true, features = ["bootloader"] }
crc = { workspace = true }
hmac-sha256 = { workspace = true }
cellguard-panic = { workspace = true }

[features]
# Host-side image signing (`verify::sign`). A device never signs, it only
# verifies, so this is enabled by host tools (cellguard-cli) and tests only.
sign = []

[dev-dependencies]
cellboot = { workspace = true, features = ["testutil"] }

[lints]
workspace = true
