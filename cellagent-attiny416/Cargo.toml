[package]
name = "cellagent-attiny416"
version = "0.1.0"
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"

[[bin]]
name = "cellagent-attiny416"
test = false
bench = false

[dependencies]
avr-device = { version = "0.8", features = ["attiny416", "rt"] }
avrxt-hal = { path = "../libraries/avrxt-hal", features = ["attiny416"] }
embedded-hal = { version = "1", default-features = false }

[patch.crates-io]
avr-device = { git = "https://github.com/stargrid-systems/avr-device", rev = "73ba68ab5bd7bb03874bc456b329f4c141f1a08e" }

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
