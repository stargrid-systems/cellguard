[package]
name = "cellagent-attiny416"
version = "0.1.0"
description = "Cellagent firmware for the ATtiny416 Xplained Nano devkit."
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.93"

[[bin]]
name = "cellagent-attiny416"
test = false
bench = false

[dependencies]
avr-device = { version = "0.8", features = ["attiny416", "rt"] }
avrxt-hal = { path = "../libraries/avrxt-hal", features = ["attiny416"] }
cellagent = { path = "../libraries/cellagent" }
cellguard-protocol = { path = "../libraries/cellguard-protocol" }
embedded-hal = { version = "1", default-features = false }
embedded-io = { version = "0.7", default-features = false }
panic-log = { path = "../libraries/panic-log", features = ["hal"] }

[patch.crates-io]
avr-device = { git = "https://github.com/stargrid-systems/avr-device", rev = "73ba68ab5bd7bb03874bc456b329f4c141f1a08e" }

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
