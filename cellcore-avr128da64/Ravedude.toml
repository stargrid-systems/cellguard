[general]

[board]
name = "avr128da64"

[board.reset]
automatic = true

[board.avrdude]
# MPLAB PICkit Basic over UPDI. Note: the PICkit Basic does NOT supply target
# power, so the board must be externally powered when flashing.
programmer = "pickit_basic_updi"
partno = "avr128da64"
baudrate = -1
do-chip-erase = true
