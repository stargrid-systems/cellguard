[package]
name = "cellcore-avr128da64"
version = "0.1.0"
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "cellcore-avr128da64"
test = false
bench = false

[lints]
workspace = true

[dependencies]
ads131m08 = { path = "../libraries/ads131m08" }
avr-device = { version = "0.9", features = ["avr128da64", "rt"] }
avrxt-hal = { path = "../libraries/avrxt-hal", features = ["avr128da64"] }
cellboot = { path = "../libraries/cellboot", features = ["avr128", "drivers"] }
cellcore = { path = "../libraries/cellcore", features = ["telemetry"] }
cellcore-runtime = { path = "../libraries/cellcore-runtime" }
cat25 = { path = "../libraries/cat25" }
embedded-hal = { version = "1", default-features = false }
embedded-hal-bus = { version = "0.3", default-features = false }
cellguard-panic = { path = "../libraries/cellguard-panic", features = ["hal"] }
cellguard-protocol = { path = "../libraries/cellguard-protocol", features = ["bootloader", "telemetry"] }
p3t1755 = { path = "../libraries/p3t1755" }
tca9535 = { path = "../libraries/tca9535" }

[patch.crates-io]
avr-device = { git = "https://github.com/stargrid-systems/avr-device", rev = "18b19ea9365b1d6a9ccb437a717bff0cceddb571" }

[profile.dev]
# .cargo/config.toml forces panic=immediate-abort for every profile, so dev
# panics abort in place too and panic records stay empty.
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
# Dropping the panic machinery saves ~4.7 KiB of flash. Panics abort in
# place, so a PanicProbe is answered empty.
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

# See: <https://rust-lang.github.io/rust-clippy/master/index.html>
[workspace.lints.clippy]
# Groups
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Individual lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
float_arithmetic = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"
# Transitive deps of avr-device pull duplicate versions of syn and friends.
# Not actionable from this crate.
multiple_crate_versions = "allow"
