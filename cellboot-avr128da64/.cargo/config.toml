[build]
target = "avr-none"
# binutils' avrxmega4_flmap.x sizes the text region for the full 128K flash,
# so the 8K boot section must be forced with a defsym.
# Do NOT force __RODATA_FLASH_START__=0: that parks .rodata's data-space VMA
# at 0x0000, so every constant load reads IO/SRAM instead of flash. The
# default window is correct. cellboot currently has no .rodata; if one
# appears, keep it inside the boot section with --section-start, not by
# moving the whole window.
rustflags = [
  "-C", "target-cpu=avr128da64",
  "-C", "link-arg=-Wl,--defsym=__TEXT_REGION_LENGTH__=0x2000",
]

[target.'cfg(target_arch = "avr")']
runner = "ravedude"

[unstable]
build-std = ["core"]

