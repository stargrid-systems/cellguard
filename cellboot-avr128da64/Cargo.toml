cargo-features = ["panic-immediate-abort"]

[package]
name = "cellboot-avr128da64"
version = "0.1.0"
description = "Bootloader firmware for the CellGuard cellcore (AVR128DA64)."
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "cellboot-avr128da64"
test = false
bench = false

[lints]
workspace = true

[dependencies]
avr-device = { version = "0.9", features = ["avr128da64", "rt"] }
avrxt-hal = { path = "../libraries/avrxt-hal", features = ["avr128da64"] }
cellboot = { path = "../libraries/cellboot", features = ["avr128", "drivers"] }
cat25 = { path = "../libraries/cat25" }
crc = { path = "../libraries/crc" }
embedded-hal = { version = "1", default-features = false }
embedded-hal-bus = { version = "0.3", default-features = false }
embedded-io = { version = "0.7", default-features = false }
cellguard-panic = { path = "../libraries/cellguard-panic", features = ["hal"] }

[patch.crates-io]
avr-device = { git = "https://github.com/stargrid-systems/avr-device", rev = "18b19ea9365b1d6a9ccb437a717bff0cceddb571" }

[profile.dev]
panic = "immediate-abort"
lto = true
opt-level = "s"

[profile.release]
panic = "immediate-abort"
codegen-units = 1
debug = true
lto = true
# opt-level "z" measured 582 B smaller than "s" for this binary.
opt-level = "z"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

# See: <https://rust-lang.github.io/rust-clippy/master/index.html>
[workspace.lints.clippy]
# Groups
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Individual lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
float_arithmetic = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"
# Transitive deps of avr-device pull duplicate versions of syn and friends.
# Not actionable from this crate.
multiple_crate_versions = "allow"
