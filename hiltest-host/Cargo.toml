[package]
name = "hiltest-host"
version = "0.1.0"
description = "Host-side runner for the CellGuard HIL test harness: flash the test image, drive tests over serial, restore the production stack."
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "hiltest"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
hiltest-protocol = { path = "../libraries/hiltest-protocol" }
serialport = { version = "4", default-features = false }

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

# See: <https://rust-lang.github.io/rust-clippy/master/index.html>
[workspace.lints.clippy]
# Groups
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Individual lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
float_arithmetic = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"
# Transitive deps of clap/serialport pull duplicate versions of bitflags and
# windows-sys. Not actionable from this crate.
multiple_crate_versions = "allow"
